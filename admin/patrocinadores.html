<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Patrocinadores | Bar do Mima ADM</title>

<link rel="icon" href="../img/logo.png">

<link rel="stylesheet"
href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css">

<link href="https://fonts.googleapis.com/css2?family=Anton&family=Montserrat:wght@400;500;600;700;800&display=swap"
rel="stylesheet">

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="../js/supabase.js"></script>

<style>

*{
    margin:0;
    padding:0;
    box-sizing:border-box;
}

body{
    font-family:"Montserrat",sans-serif;
    background:#080808;
    color:#fff;
}

button,
input,
textarea,
select{
    font-family:inherit;
}

/* =========================
   SIDEBAR
========================= */

.sidebar{
    position:fixed;
    left:0;
    top:0;
    bottom:0;

    width:250px;

    background:#0d0d0d;
    border-right:1px solid #222;

    padding:25px 15px;

    overflow-y:auto;

    z-index:100;
}

.logo{
    display:flex;
    align-items:center;
    gap:12px;

    padding:0 10px 25px;
}

.logo img{
    width:48px;
    height:48px;
    object-fit:contain;
}

.logo strong{
    display:block;
    font-family:"Anton";
    font-size:20px;
    font-weight:400;
}

.logo span{
    color:#f5c400;
    font-size:9px;
    font-weight:800;
    letter-spacing:2px;
}

.menu{
    display:flex;
    flex-direction:column;
    gap:6px;
}

.menu a{
    display:flex;
    align-items:center;
    gap:12px;

    padding:13px 15px;

    color:#999;

    text-decoration:none;

    border-radius:9px;

    font-size:12px;
    font-weight:700;

    transition:.2s;
}

.menu a:hover{
    background:#171717;
    color:#fff;
}

.menu a.active{
    background:#f5c400;
    color:#111;
}

.menu i{
    width:20px;
    text-align:center;
}

/* =========================
   MAIN
========================= */

.main{
    margin-left:250px;
    min-height:100vh;
}

.topbar{
    min-height:78px;

    display:flex;
    align-items:center;
    justify-content:space-between;

    gap:15px;

    padding:18px 30px;

    background:#0d0d0d;
    border-bottom:1px solid #222;
}

.topbar h1{
    font-family:"Anton";
    font-size:26px;
    font-weight:400;
}

.topbar span{
    color:#777;
    font-size:10px;
}

.content{
    padding:30px;
}

/* =========================
   BUTTON
========================= */

.btn{
    border:0;
    border-radius:8px;

    padding:12px 16px;

    cursor:pointer;

    font-size:10px;
    font-weight:900;

    text-transform:uppercase;

    transition:.2s;
}

.btn-primary{
    background:#f5c400;
    color:#111;
}

.btn-primary:hover{
    transform:translateY(-2px);
}

.btn-danger{
    background:#dc2626;
    color:#fff;
}

.btn-secondary{
    background:#252525;
    color:#fff;
}

/* =========================
   STATS
========================= */

.stats{
    display:grid;

    grid-template-columns:
    repeat(3,minmax(0,1fr));

    gap:15px;

    margin-bottom:25px;
}

.stat{
    background:#111;

    border:1px solid #242424;
    border-radius:12px;

    padding:20px;
}

.stat span{
    display:block;

    color:#777;

    font-size:9px;
    font-weight:800;

    text-transform:uppercase;
}

.stat strong{
    display:block;

    margin-top:7px;

    color:#f5c400;

    font-family:"Anton";

    font-size:31px;
    font-weight:400;
}

/* =========================
   TOOLBAR
========================= */

.toolbar{
    display:flex;

    align-items:center;
    justify-content:space-between;

    gap:15px;

    margin-bottom:20px;
}

.search{
    width:100%;
    max-width:420px;

    position:relative;
}

.search i{
    position:absolute;

    left:14px;
    top:50%;

    transform:translateY(-50%);

    color:#555;
}

.search input{
    width:100%;

    padding:13px 15px 13px 40px;

    border:1px solid #292929;
    border-radius:8px;

    background:#111;
    color:#fff;

    outline:none;
}

.search input:focus{
    border-color:#f5c400;
}

/* =========================
   GRID
========================= */

.grid{
    display:grid;

    grid-template-columns:
    repeat(3,minmax(0,1fr));

    gap:18px;
}

.card{
    position:relative;

    overflow:hidden;

    background:#111;

    border:1px solid #242424;
    border-radius:13px;
}

.card-logo{
    height:190px;

    display:flex;
    align-items:center;
    justify-content:center;

    padding:25px;

    background:#161616;
}

.card-logo img{
    width:100%;
    height:100%;

    object-fit:contain;
}

.sem-logo{
    color:#444;
    font-size:50px;
}

.destaque{
    position:absolute;

    top:12px;
    right:12px;

    width:34px;
    height:34px;

    display:flex;
    align-items:center;
    justify-content:center;

    border-radius:50%;

    background:#f5c400;
    color:#111;

    z-index:2;
}

.card-body{
    padding:18px;
}

.card-body h3{
    font-family:"Anton";
    font-size:23px;
    font-weight:400;

    text-transform:uppercase;
}

.card-body p{
    min-height:36px;

    margin-top:7px;

    color:#888;

    font-size:10px;
    line-height:1.6;
}

.status{
    display:inline-block;

    margin-top:12px;

    padding:6px 9px;

    border-radius:20px;

    font-size:8px;
    font-weight:900;

    text-transform:uppercase;
}

.status.on{
    background:rgba(34,197,94,.12);
    color:#22c55e;
}

.status.off{
    background:rgba(239,68,68,.12);
    color:#ef4444;
}

.order{
    margin-left:7px;

    color:#666;

    font-size:8px;
    font-weight:800;
}

.actions{
    display:flex;
    gap:8px;

    margin-top:17px;
}

.actions button{
    flex:1;
}

/* =========================
   EMPTY
========================= */

.empty{
    grid-column:1/-1;

    padding:60px 20px;

    text-align:center;

    border:1px dashed #292929;
    border-radius:13px;

    color:#666;
}

.empty i{
    display:block;

    margin-bottom:15px;

    color:#f5c400;

    font-size:42px;
}

/* =========================
   MODAL
========================= */

.modal{
    display:none;

    position:fixed;
    inset:0;

    z-index:999;

    padding:20px;

    background:rgba(0,0,0,.85);

    align-items:center;
    justify-content:center;
}

.modal.active{
    display:flex;
}

.modal-box{
    width:min(650px,100%);
    max-height:90vh;

    overflow:auto;

    background:#111;

    border:1px solid #333;
    border-radius:14px;
}

.modal-header{
    display:flex;
    align-items:center;
    justify-content:space-between;

    padding:20px 22px;

    border-bottom:1px solid #242424;
}

.modal-header h2{
    font-family:"Anton";

    font-size:23px;
    font-weight:400;
}

.close{
    border:0;
    background:none;

    color:#888;

    font-size:22px;

    cursor:pointer;
}

.form{
    padding:22px;
}

.form-grid{
    display:grid;

    grid-template-columns:1fr 1fr;

    gap:15px;
}

.field{
    margin-bottom:15px;
}

.field.full{
    grid-column:1/-1;
}

.field label{
    display:block;

    margin-bottom:7px;

    color:#888;

    font-size:9px;
    font-weight:800;

    text-transform:uppercase;
}

.field input,
.field textarea,
.field select{
    width:100%;

    padding:12px;

    border:1px solid #292929;
    border-radius:7px;

    background:#0a0a0a;
    color:#fff;

    outline:none;
}

.field textarea{
    min-height:90px;
    resize:vertical;
}

.field input:focus,
.field textarea:focus{
    border-color:#f5c400;
}

.checks{
    display:flex;
    flex-wrap:wrap;
    gap:20px;

    margin-top:5px;
}

.check{
    display:flex;
    align-items:center;
    gap:8px;

    color:#aaa;

    font-size:10px;
    font-weight:700;
}

.check input{
    accent-color:#f5c400;
}

.preview{
    display:none;

    width:100%;
    height:160px;

    margin-top:12px;

    padding:15px;

    object-fit:contain;

    background:#080808;

    border:1px solid #292929;
    border-radius:8px;
}

.form-actions{
    display:flex;
    justify-content:flex-end;
    gap:10px;

    margin-top:22px;
}

/* =========================
   TOAST
========================= */

.toast{
    position:fixed;

    right:25px;
    bottom:25px;

    z-index:2000;

    padding:14px 18px;

    border-radius:9px;

    background:#f5c400;
    color:#111;

    font-size:10px;
    font-weight:900;

    opacity:0;
    pointer-events:none;

    transform:translateY(20px);

    transition:.3s;
}

.toast.show{
    opacity:1;
    transform:translateY(0);
}

/* =========================
   RESPONSIVO
========================= */

@media(max-width:1000px){

    .grid{
        grid-template-columns:repeat(2,1fr);
    }

}

@media(max-width:750px){

    .sidebar{
        position:relative;
        width:100%;
    }

    .main{
        margin-left:0;
    }

    .menu{
        display:grid;
        grid-template-columns:repeat(2,1fr);
    }

    .topbar{
        padding:18px;
    }

    .content{
        padding:18px;
    }

    .stats{
        grid-template-columns:1fr;
    }

    .grid{
        grid-template-columns:1fr;
    }

    .toolbar{
        align-items:stretch;
        flex-direction:column;
    }

    .search{
        max-width:none;
    }

    .form-grid{
        grid-template-columns:1fr;
    }

    .field.full{
        grid-column:auto;
    }

}

</style>
</head>

<body>

<!-- SIDEBAR -->

<aside class="sidebar">

    <div class="logo">

        <img src="../img/logo.png">

        <div>
            <strong>BAR DO MIMA</strong>
            <span>ADMINISTRAÇÃO</span>
        </div>

    </div>

    <nav class="menu">

        <a href="dashboard.html">
            <i class="fa-solid fa-house"></i>
            Dashboard
        </a>

        <a href="jogadores.html">
            <i class="fa-solid fa-users"></i>
            Elenco
        </a>

        <a href="comissao.html">
            <i class="fa-solid fa-user-tie"></i>
            Comissão Técnica
        </a>

        <a href="noticias.html">
            <i class="fa-solid fa-newspaper"></i>
            Notícias
        </a>

        <a href="jogos.html">
            <i class="fa-solid fa-futbol"></i>
            Jogos
        </a>

        <a href="titulos.html">
            <i class="fa-solid fa-trophy"></i>
            Títulos
        </a>

        <a href="galeria.html">
            <i class="fa-solid fa-images"></i>
            Galeria
        </a>

        <a href="patrocinadores.html" class="active">
            <i class="fa-solid fa-handshake"></i>
            Patrocinadores
        </a>

    </nav>

</aside>


<!-- MAIN -->

<main class="main">

    <div class="topbar">

        <div>
            <h1>PATROCINADORES</h1>
            <span>Gerencie os parceiros do Bar do Mima</span>
        </div>

        <button
            class="btn btn-primary"
            onclick="novoPatrocinador()"
        >
            <i class="fa-solid fa-plus"></i>
            Novo Patrocinador
        </button>

    </div>


    <div class="content">

        <div class="stats">

            <div class="stat">
                <span>Total</span>
                <strong id="totalStat">0</strong>
            </div>

            <div class="stat">
                <span>Publicados</span>
                <strong id="publicadosStat">0</strong>
            </div>

            <div class="stat">
                <span>Destaques</span>
                <strong id="destaquesStat">0</strong>
            </div>

        </div>


        <div class="toolbar">

            <div class="search">

                <i class="fa-solid fa-magnifying-glass"></i>

                <input
                    id="searchInput"
                    type="text"
                    placeholder="Buscar patrocinador..."
                >

            </div>

        </div>


        <div class="grid" id="patrocinadoresGrid">

            <div class="empty">
                <i class="fa-solid fa-spinner fa-spin"></i>
                Carregando patrocinadores...
            </div>

        </div>

    </div>

</main>


<!-- MODAL -->

<div class="modal" id="modal">

    <div class="modal-box">

        <div class="modal-header">

            <h2 id="modalTitle">
                NOVO PATROCINADOR
            </h2>

            <button
                class="close"
                onclick="fecharModal()"
            >
                <i class="fa-solid fa-xmark"></i>
            </button>

        </div>


        <form
            class="form"
            id="formPatrocinador"
        >

            <div class="form-grid">


                <div class="field full">

                    <label>
                        Nome *
                    </label>

                    <input
                        type="text"
                        id="nome"
                        required
                        placeholder="Ex: Mercado do João"
                    >

                </div>


                <div class="field full">

                    <label>
                        Logo
                    </label>

                    <input
                        type="file"
                        id="logo"
                        accept="image/jpeg,image/png,image/webp"
                    >

                    <img
                        id="preview"
                        class="preview"
                    >

                </div>


                <div class="field">

                    <label>
                        Site / Link
                    </label>

                    <input
                        type="url"
                        id="link"
                        placeholder="https://..."
                    >

                </div>


                <div class="field">

                    <label>
                        Instagram
                    </label>

                    <input
                        type="text"
                        id="instagram"
                        placeholder="@empresa"
                    >

                </div>


                <div class="field">

                    <label>
                        Ordem de exibição
                    </label>

                    <input
                        type="number"
                        id="ordem"
                        value="0"
                        min="0"
                    >

                </div>


                <div class="field full">

                    <label>
                        Descrição
                    </label>

                    <textarea
                        id="descricao"
                        placeholder="Pequena descrição do patrocinador..."
                    ></textarea>

                </div>


                <div class="field full">

                    <div class="checks">

                        <label class="check">

                            <input
                                type="checkbox"
                                id="destaque"
                            >

                            Patrocinador em destaque

                        </label>


                        <label class="check">

                            <input
                                type="checkbox"
                                id="publicado"
                                checked
                            >

                            Publicado no site

                        </label>

                    </div>

                </div>


            </div>


            <div class="form-actions">

                <button
                    type="button"
                    class="btn btn-secondary"
                    onclick="fecharModal()"
                >
                    Cancelar
                </button>

                <button
                    type="submit"
                    class="btn btn-primary"
                    id="salvarBtn"
                >
                    Salvar Patrocinador
                </button>

            </div>

        </form>

    </div>

</div>


<div class="toast" id="toast"></div>


<script>

/* ==============================
   VARIÁVEIS
============================== */

let patrocinadores = [];

let patrocinadorEditando = null;

let logoAtual = null;


/* ==============================
   ELEMENTOS
============================== */

const grid =
document.getElementById("patrocinadoresGrid");

const modal =
document.getElementById("modal");

const form =
document.getElementById("formPatrocinador");

const preview =
document.getElementById("preview");

const logoInput =
document.getElementById("logo");

const searchInput =
document.getElementById("searchInput");


/* ==============================
   SEGURANÇA ADMIN
============================== */

async function verificarAdmin(){

    const {
        data:{session}
    } =
    await supabaseClient.auth.getSession();


    if(!session){

        window.location.href =
        "login.html";

        return false;

    }


    const {
        data:admin,
        error
    } =
    await supabaseClient

    .from("administradores")

    .select("id")

    .eq("id",session.user.id)

    .maybeSingle();


    if(error || !admin){

        await supabaseClient.auth.signOut();

        window.location.href =
        "login.html";

        return false;

    }


    return true;

}


/* ==============================
   CARREGAR
============================== */

async function carregarPatrocinadores(){

    const {
        data,
        error
    } =
    await supabaseClient

    .from("patrocinadores")

    .select("*")

    .order("ordem",{
        ascending:true
    })

    .order("created_at",{
        ascending:false
    });


    if(error){

        console.error(error);

        grid.innerHTML = `

            <div class="empty">

                <i class="fa-solid fa-triangle-exclamation"></i>

                Erro ao carregar patrocinadores.

            </div>

        `;

        return;

    }


    patrocinadores =
    data || [];


    atualizarStats();

    renderizar();

}


/* ==============================
   ESTATÍSTICAS
============================== */

function atualizarStats(){

    document.getElementById(
        "totalStat"
    ).textContent =
    patrocinadores.length;


    document.getElementById(
        "publicadosStat"
    ).textContent =
    patrocinadores.filter(
        p => p.publicado
    ).length;


    document.getElementById(
        "destaquesStat"
    ).textContent =
    patrocinadores.filter(
        p => p.destaque
    ).length;

}


/* ==============================
   ESCAPAR HTML
============================== */

function escaparHTML(valor){

    const div =
    document.createElement("div");

    div.textContent =
    valor ?? "";

    return div.innerHTML;

}


/* ==============================
   RENDERIZAR
============================== */

function renderizar(){

    const busca =
    searchInput.value
    .toLowerCase()
    .trim();


    const lista =
    patrocinadores.filter(p => {

        return String(
            p.nome || ""
        )
        .toLowerCase()
        .includes(busca);

    });


    if(lista.length === 0){

        grid.innerHTML = `

            <div class="empty">

                <i class="fa-solid fa-handshake"></i>

                Nenhum patrocinador encontrado.

            </div>

        `;

        return;

    }


    grid.innerHTML =
    lista.map(p => {


        const logo =
        p.logo_url

        ? `

            <img
                src="${escaparHTML(p.logo_url)}"
                alt="${escaparHTML(p.nome)}"
            >

          `

        : `

            <i
                class="fa-solid fa-handshake sem-logo"
            ></i>

          `;


        const destaque =
        p.destaque

        ? `

            <span
                class="destaque"
                title="Patrocinador em destaque"
            >
                <i class="fa-solid fa-star"></i>
            </span>

          `

        : "";


        return `

            <article class="card">

                ${destaque}

                <div class="card-logo">

                    ${logo}

                </div>


                <div class="card-body">

                    <h3>
                        ${escaparHTML(p.nome)}
                    </h3>

                    <p>
                        ${escaparHTML(
                            p.descricao ||
                            "Sem descrição."
                        )}
                    </p>


                    <span class="status ${
                        p.publicado
                        ? "on"
                        : "off"
                    }">

                        ${
                            p.publicado
                            ? "Publicado"
                            : "Oculto"
                        }

                    </span>


                    <span class="order">

                        Ordem:
                        ${Number(p.ordem || 0)}

                    </span>


                    <div class="actions">

                        <button
                            class="btn btn-secondary"
                            onclick="editarPatrocinador(${p.id})"
                        >
                            <i class="fa-solid fa-pen"></i>
                            Editar
                        </button>


                        <button
                            class="btn btn-danger"
                            onclick="excluirPatrocinador(${p.id})"
                        >
                            <i class="fa-solid fa-trash"></i>
                            Excluir
                        </button>

                    </div>

                </div>

            </article>

        `;

    }).join("");

}


/* ==============================
   BUSCA
============================== */

searchInput.addEventListener(
    "input",
    renderizar
);


/* ==============================
   NOVO
============================== */

function novoPatrocinador(){

    patrocinadorEditando = null;

    logoAtual = null;

    form.reset();

    document.getElementById(
        "publicado"
    ).checked = true;

    document.getElementById(
        "ordem"
    ).value = 0;

    preview.style.display =
    "none";

    preview.src = "";

    document.getElementById(
        "modalTitle"
    ).textContent =
    "NOVO PATROCINADOR";

    modal.classList.add(
        "active"
    );

}


/* ==============================
   EDITAR
============================== */

function editarPatrocinador(id){

    const p =
    patrocinadores.find(
        item => item.id === id
    );


    if(!p){
        return;
    }


    patrocinadorEditando =
    p.id;

    logoAtual =
    p.logo_url || null;


    document.getElementById(
        "nome"
    ).value =
    p.nome || "";


    document.getElementById(
        "descricao"
    ).value =
    p.descricao || "";


    document.getElementById(
        "link"
    ).value =
    p.link || "";


    document.getElementById(
        "instagram"
    ).value =
    p.instagram || "";


    document.getElementById(
        "ordem"
    ).value =
    p.ordem ?? 0;


    document.getElementById(
        "destaque"
    ).checked =
    !!p.destaque;


    document.getElementById(
        "publicado"
    ).checked =
    !!p.publicado;


    logoInput.value = "";


    if(logoAtual){

        preview.src =
        logoAtual;

        preview.style.display =
        "block";

    }else{

        preview.src = "";

        preview.style.display =
        "none";

    }


    document.getElementById(
        "modalTitle"
    ).textContent =
    "EDITAR PATROCINADOR";


    modal.classList.add(
        "active"
    );

}


/* ==============================
   PREVIEW
============================== */

logoInput.addEventListener(
    "change",
    ()=>{

        const arquivo =
        logoInput.files[0];


        if(!arquivo){
            return;
        }


        if(arquivo.size >
           5 * 1024 * 1024){

            mostrarToast(
                "A imagem deve ter no máximo 5 MB."
            );

            logoInput.value = "";

            return;

        }


        const url =
        URL.createObjectURL(
            arquivo
        );


        preview.src =
        url;

        preview.style.display =
        "block";

    }
);


/* ==============================
   UPLOAD
============================== */

async function enviarLogo(){

    const arquivo =
    logoInput.files[0];


    if(!arquivo){

        return logoAtual;

    }


    const extensao =
    arquivo.name
    .split(".")
    .pop()
    .toLowerCase();


    const caminho =

    `patrocinadores/${
        Date.now()
    }-${
        crypto.randomUUID()
    }.${extensao}`;


    const {
        error
    } =
    await supabaseClient.storage

    .from("imagens")

    .upload(
        caminho,
        arquivo,
        {
            cacheControl:"3600",
            upsert:false
        }
    );


    if(error){

        throw error;

    }


    const {
        data
    } =
    supabaseClient.storage

    .from("imagens")

    .getPublicUrl(
        caminho
    );


    return data.publicUrl;

}


/* ==============================
   SALVAR
============================== */

form.addEventListener(
    "submit",
    async event => {

        event.preventDefault();


        const salvarBtn =
        document.getElementById(
            "salvarBtn"
        );


        salvarBtn.disabled =
        true;

        salvarBtn.textContent =
        "Salvando...";


        try{


            const logoURL =
            await enviarLogo();


            const dados = {

                nome:
                document.getElementById(
                    "nome"
                ).value.trim(),

                descricao:
                document.getElementById(
                    "descricao"
                ).value.trim()
                || null,

                logo_url:
                logoURL || null,

                link:
                document.getElementById(
                    "link"
                ).value.trim()
                || null,

                instagram:
                document.getElementById(
                    "instagram"
                ).value.trim()
                || null,

                ordem:
                Number(
                    document.getElementById(
                        "ordem"
                    ).value || 0
                ),

                destaque:
                document.getElementById(
                    "destaque"
                ).checked,

                publicado:
                document.getElementById(
                    "publicado"
                ).checked

            };


            if(!dados.nome){

                throw new Error(
                    "Informe o nome do patrocinador."
                );

            }


            if(patrocinadorEditando){

                const {
                    error
                } =
                await supabaseClient

                .from("patrocinadores")

                .update(dados)

                .eq(
                    "id",
                    patrocinadorEditando
                );


                if(error){
                    throw error;
                }


                mostrarToast(
                    "Patrocinador atualizado!"
                );

            }else{

                const {
                    error
                } =
                await supabaseClient

                .from("patrocinadores")

                .insert(dados);


                if(error){
                    throw error;
                }


                mostrarToast(
                    "Patrocinador cadastrado!"
                );

            }


            fecharModal();

            await carregarPatrocinadores();


        }catch(error){

            console.error(error);

            mostrarToast(
                error.message ||
                "Erro ao salvar patrocinador."
            );

        }finally{

            salvarBtn.disabled =
            false;

            salvarBtn.textContent =
            "Salvar Patrocinador";

        }

    }
);


/* ==============================
   EXCLUIR
============================== */

async function excluirPatrocinador(id){

    const patrocinador =
    patrocinadores.find(
        p => p.id === id
    );


    if(!patrocinador){
        return;
    }


    const confirmar =
    confirm(
        `Excluir "${patrocinador.nome}"?`
    );


    if(!confirmar){
        return;
    }


    const {
        error
    } =
    await supabaseClient

    .from("patrocinadores")

    .delete()

    .eq("id",id);


    if(error){

        console.error(error);

        mostrarToast(
            "Erro ao excluir."
        );

        return;

    }


    mostrarToast(
        "Patrocinador excluído!"
    );


    await carregarPatrocinadores();

}


/* ==============================
   MODAL
============================== */

function fecharModal(){

    modal.classList.remove(
        "active"
    );

}


modal.addEventListener(
    "click",
    event => {

        if(event.target === modal){

            fecharModal();

        }

    }
);


document.addEventListener(
    "keydown",
    event => {

        if(event.key === "Escape"){

            fecharModal();

        }

    }
);


/* ==============================
   TOAST
============================== */

let toastTimer;

function mostrarToast(mensagem){

    const toast =
    document.getElementById(
        "toast"
    );


    toast.textContent =
    mensagem;


    toast.classList.add(
        "show"
    );


    clearTimeout(
        toastTimer
    );


    toastTimer =
    setTimeout(()=>{

        toast.classList.remove(
            "show"
        );

    },3000);

}

   INICIAR
============================== */

(async ()=>{

    const admin =
    await verificarAdmin();


    if(admin){

        await carregarPatrocinadores();

    }

})();
