<!DOCTYPE html>
<html lang="pt-BR">

<head>

<meta charset="UTF-8">

<meta name="viewport"
      content="width=device-width, initial-scale=1.0">

<meta name="theme-color"
      content="#070707">

<title>Login | Bar do Mima ADM</title>

<link rel="icon"
      href="../img/logo.png">

<link rel="preconnect"
      href="https://fonts.googleapis.com">

<link rel="preconnect"
      href="https://fonts.gstatic.com"
      crossorigin>

<link href="https://fonts.googleapis.com/css2?family=Anton&family=Montserrat:wght@400;500;600;700;800&display=swap"
      rel="stylesheet">

<link rel="stylesheet"
      href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css">

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<script src="../js/supabase.js"></script>


<style>

*{
    margin:0;
    padding:0;
    box-sizing:border-box;
}

:root{
    --yellow:#f5c400;
    --yellow-light:#ffd900;
    --black:#070707;
    --card:#111111;
    --border:#292929;
    --gray:#8c8c8c;
}

body{

    min-height:100vh;

    display:flex;
    align-items:center;
    justify-content:center;

    padding:25px;

    background:
        radial-gradient(
            circle at 50% 20%,
            rgba(245,196,0,.16),
            transparent 35%
        ),
        #070707;

    color:white;

    font-family:"Montserrat",sans-serif;

}


/* FUNDO */

body::before{

    content:"";

    position:fixed;

    inset:0;

    pointer-events:none;

    background:
        linear-gradient(
            rgba(255,255,255,.015) 1px,
            transparent 1px
        ),
        linear-gradient(
            90deg,
            rgba(255,255,255,.015) 1px,
            transparent 1px
        );

    background-size:40px 40px;

}


/* LOGIN */

.login-container{

    width:100%;

    max-width:440px;

    position:relative;

    z-index:2;

}


/* LOGO */

.login-brand{

    text-align:center;

    margin-bottom:25px;

}

.login-logo{

    width:125px;
    height:125px;

    object-fit:contain;

    margin:auto;

    filter:
        drop-shadow(
            0 12px 25px rgba(0,0,0,.5)
        );

}

.login-brand h1{

    font-family:"Anton",sans-serif;

    font-size:40px;

    margin-top:12px;

    letter-spacing:1px;

}

.login-brand h1 span{

    color:var(--yellow);

}

.login-brand p{

    margin-top:5px;

    color:#777;

    font-size:10px;

    font-weight:800;

    letter-spacing:3px;

}


/* CARD */

.login-card{

    background:
        linear-gradient(
            145deg,
            #141414,
            #0d0d0d
        );

    border:1px solid var(--border);

    border-radius:22px;

    padding:35px;

    box-shadow:
        0 30px 70px rgba(0,0,0,.55);

    position:relative;

    overflow:hidden;

}

.login-card::before{

    content:"";

    position:absolute;

    top:0;
    left:0;

    width:100%;
    height:4px;

    background:var(--yellow);

}


/* TITULO */

.login-title{

    margin-bottom:28px;

}

.login-title span{

    color:var(--yellow);

    font-size:10px;

    font-weight:900;

    letter-spacing:3px;

}

.login-title h2{

    font-family:"Anton",sans-serif;

    font-size:32px;

    margin-top:4px;

}


/* INPUT */

.form-group{

    margin-bottom:18px;

}

.form-group label{

    display:block;

    margin-bottom:8px;

    color:#aaa;

    font-size:11px;

    font-weight:800;

}

.input-box{

    position:relative;

}

.input-box > i{

    position:absolute;

    left:16px;

    top:50%;

    transform:translateY(-50%);

    color:#666;

}

.input-box input{

    width:100%;

    height:52px;

    padding:

        0 48px
        0 45px;

    border-radius:10px;

    border:1px solid #303030;

    outline:none;

    background:#090909;

    color:white;

    font-family:inherit;

    transition:.2s;

}

.input-box input:focus{

    border-color:var(--yellow);

    box-shadow:
        0 0 0 3px
        rgba(245,196,0,.08);

}


/* OLHO SENHA */

.password-button{

    position:absolute;

    right:8px;

    top:50%;

    transform:translateY(-50%);

    width:38px;
    height:38px;

    border:none;

    border-radius:8px;

    background:transparent;

    color:#777;

    cursor:pointer;

}

.password-button:hover{

    color:var(--yellow);

}


/* BOTÃO */

.login-button{

    width:100%;

    height:54px;

    margin-top:8px;

    border:none;

    border-radius:10px;

    background:var(--yellow);

    color:#111;

    font-family:inherit;

    font-size:13px;

    font-weight:900;

    cursor:pointer;

    transition:.25s;

}

.login-button:hover{

    background:var(--yellow-light);

    transform:translateY(-2px);

    box-shadow:
        0 12px 25px
        rgba(245,196,0,.15);

}

.login-button:disabled{

    opacity:.6;

    cursor:not-allowed;

    transform:none;

}


/* MENSAGEM */

.message{

    display:none;

    margin-top:18px;

    padding:12px;

    border-radius:8px;

    font-size:12px;

    font-weight:700;

    line-height:1.5;

}

.message.error{

    display:block;

    background:rgba(220,38,38,.12);

    border:1px solid rgba(220,38,38,.35);

    color:#ff8080;

}

.message.success{

    display:block;

    background:rgba(34,197,94,.10);

    border:1px solid rgba(34,197,94,.30);

    color:#75e39a;

}


/* SEGURANÇA */

.security{

    margin-top:22px;

    display:flex;

    justify-content:center;

    align-items:center;

    gap:8px;

    color:#555;

    font-size:10px;

    font-weight:700;

}

.security i{

    color:var(--yellow);

}


/* VOLTAR */

.back-site{

    margin-top:20px;

    text-align:center;

}

.back-site a{

    color:#777;

    text-decoration:none;

    font-size:11px;

    font-weight:700;

    transition:.2s;

}

.back-site a:hover{

    color:var(--yellow);

}


/* MOBILE */

@media(max-width:500px){

    body{

        padding:18px;

    }

    .login-card{

        padding:28px 22px;

    }

    .login-logo{

        width:105px;
        height:105px;

    }

    .login-brand h1{

        font-size:34px;

    }

}

</style>

</head>


<body>


<main class="login-container">


    <div class="login-brand">

        <img
            src="../img/logo.png"
            alt="Bar do Mima"
            class="login-logo"
        >

        <h1>

            BAR DO
            <span>MIMA</span>

        </h1>

        <p>

            PAINEL ADMINISTRATIVO

        </p>

    </div>


    <div class="login-card">


        <div class="login-title">

            <span>
                ACESSO RESTRITO
            </span>

            <h2>
                ENTRAR NO PAINEL
            </h2>

        </div>


        <form id="loginForm">


            <div class="form-group">

                <label for="email">

                    E-MAIL

                </label>

                <div class="input-box">

                    <i class="fa-solid fa-envelope"></i>

                    <input
                        type="email"
                        id="email"
                        placeholder="Digite seu e-mail"
                        autocomplete="email"
                        required
                    >

                </div>

            </div>


            <div class="form-group">

                <label for="password">

                    SENHA

                </label>

                <div class="input-box">

                    <i class="fa-solid fa-lock"></i>

                    <input
                        type="password"
                        id="password"
                        placeholder="Digite sua senha"
                        autocomplete="current-password"
                        required
                    >

                    <button
                        type="button"
                        class="password-button"
                        id="passwordButton"
                        aria-label="Mostrar senha"
                    >

                        <i class="fa-solid fa-eye"></i>

                    </button>

                </div>

            </div>


            <button
                type="submit"
                class="login-button"
                id="loginButton"
            >

                <i class="fa-solid fa-right-to-bracket"></i>

                &nbsp;

                ENTRAR

            </button>


            <div
                class="message"
                id="message">
            </div>


        </form>


        <div class="security">

            <i class="fa-solid fa-shield-halved"></i>

            Área protegida • Bar do Mima

        </div>


    </div>


    <div class="back-site">

        <a href="../index.html">

            <i class="fa-solid fa-arrow-left"></i>

            Voltar para o site

        </a>

    </div>


</main>


<script>


const loginForm =
document.getElementById("loginForm");

const loginButton =
document.getElementById("loginButton");

const message =
document.getElementById("message");

const passwordInput =
document.getElementById("password");

const passwordButton =
document.getElementById("passwordButton");


/* =============================================
   MOSTRAR / ESCONDER SENHA
============================================= */

passwordButton.addEventListener(
    "click",
    () => {

        const icon =
            passwordButton.querySelector("i");

        if(passwordInput.type === "password"){

            passwordInput.type = "text";

            icon.classList.remove("fa-eye");

            icon.classList.add("fa-eye-slash");

        }else{

            passwordInput.type = "password";

            icon.classList.remove("fa-eye-slash");

            icon.classList.add("fa-eye");

        }

    }
);


/* =============================================
   LOGIN
============================================= */

loginForm.addEventListener(
    "submit",
    async (event) => {

        event.preventDefault();

        message.className = "message";
        message.textContent = "";

        const email =
            document
            .getElementById("email")
            .value
            .trim();

        const password =
            passwordInput.value;


        loginButton.disabled = true;

        loginButton.innerHTML = `

            <i class="fa-solid fa-spinner fa-spin"></i>

            &nbsp;

            ENTRANDO...

        `;


        try{

            const {
                data,
                error
            } =
            await supabaseClient
            .auth
            .signInWithPassword({

                email: email,

                password: password

            });


            if(error){

                throw error;

            }


            message.className =
                "message success";

            message.textContent =
                "Login realizado! Abrindo painel...";


            setTimeout(() => {

                window.location.href =
                    "dashboard.html";

            }, 900);


        }catch(error){

            console.error(error);

            message.className =
                "message error";

            if(
                error.message ===
                "Invalid login credentials"
            ){

                message.textContent =
                    "E-mail ou senha incorretos.";

            }else{

                message.textContent =
                    "Não foi possível entrar. Tente novamente.";

            }

        }finally{

            loginButton.disabled = false;

            loginButton.innerHTML = `

                <i class="fa-solid fa-right-to-bracket"></i>

                &nbsp;

                ENTRAR

            `;

        }

    }
);


/* =============================================
   SE JÁ ESTIVER LOGADO
============================================= */

async function verificarSessao(){

    const {
        data: { session }
    } =
    await supabaseClient
    .auth
    .getSession();


    if(session){

        window.location.href =
            "dashboard.html";

    }

}


verificarSessao();


</script>


</body>
</html>
